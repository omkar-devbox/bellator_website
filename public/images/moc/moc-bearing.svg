<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bearingOuter" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="cageBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="bearingShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#bearingShadow)">
    <!-- Outer Race -->
    <circle cx="100" cy="100" r="82" fill="url(#bearingOuter)"/>
    <circle cx="100" cy="100" r="72" fill="#0f172a"/>
    <!-- Ball Race Channel -->
    <circle cx="100" cy="100" r="62" fill="url(#cageBrass)"/>
    <!-- Inner Race -->
    <circle cx="100" cy="100" r="48" fill="#0f172a"/>
    <circle cx="100" cy="100" r="44" fill="url(#bearingOuter)"/>
    <circle cx="100" cy="100" r="32" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>

    <!-- Ball Bearings (8 precision balls) -->
    <circle cx="100" cy="42" r="11" fill="url(#ballGrad)"/>
    <circle cx="141" cy="59" r="11" fill="url(#ballGrad)"/>
    <circle cx="158" cy="100" r="11" fill="url(#ballGrad)"/>
    <circle cx="141" cy="141" r="11" fill="url(#ballGrad)"/>
    <circle cx="100" cy="158" r="11" fill="url(#ballGrad)"/>
    <circle cx="59" cy="141" r="11" fill="url(#ballGrad)"/>
    <circle cx="42" cy="100" r="11" fill="url(#ballGrad)"/>
    <circle cx="59" cy="59" r="11" fill="url(#ballGrad)"/>
  </g>
</svg>
