<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="elecGray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="elecDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="elecShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#elecShadow)">
    <!-- Electric Motor Body (Right) -->
    <rect x="110" y="52" width="60" height="46" rx="6" fill="url(#elecGray)" stroke="#475569" stroke-width="1.5"/>
    <path d="M120 52 L120 98 M130 52 L130 98 M140 52 L140 98 M150 52 L150 98 M160 52 L160 98" stroke="#64748b" stroke-width="1.5"/>
    <rect x="170" y="58" width="10" height="34" rx="2" fill="url(#elecDark)"/>

    <!-- Central Gear Housing -->
    <rect x="68" y="42" width="48" height="66" rx="8" fill="url(#elecGray)" stroke="#334155" stroke-width="2"/>
    <!-- Terminal Box / Digital Display Display -->
    <rect x="74" y="52" width="36" height="26" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <rect x="78" y="56" width="28" height="12" rx="2" fill="#0284c7"/>
    <circle cx="82" cy="73" r="2.5" fill="#ef4444"/>
    <circle cx="92" cy="73" r="2.5" fill="#22c55e"/>
    <circle cx="102" cy="73" r="2.5" fill="#eab308"/>

    <!-- Left Declutch Lever & Handwheel -->
    <rect x="42" y="70" width="28" height="10" fill="url(#elecDark)"/>
    <ellipse cx="40" cy="75" rx="6" ry="24" fill="none" stroke="#334155" stroke-width="4"/>
    <ellipse cx="40" cy="75" rx="3" ry="12" fill="#64748b"/>

    <!-- Bottom Valve Mounting Base -->
    <rect x="80" y="108" width="24" height="22" rx="3" fill="url(#elecDark)"/>
  </g>
</svg>
