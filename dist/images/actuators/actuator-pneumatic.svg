<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="pneuBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="35%" stop-color="#1d4ed8"/>
      <stop offset="70%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="metalSilver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="indicatorYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="pneuShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#pneuShadow)">
    <!-- Main Cylinder Body -->
    <rect x="35" y="55" width="130" height="60" rx="8" fill="url(#pneuBlue)" stroke="#1e3a8a" stroke-width="2"/>
    <!-- Cylinder End Caps -->
    <rect x="25" y="52" width="14" height="66" rx="4" fill="url(#pneuBlue)" stroke="#1e3a8a" stroke-width="1.5"/>
    <rect x="161" y="52" width="14" height="66" rx="4" fill="url(#pneuBlue)" stroke="#1e3a8a" stroke-width="1.5"/>
    <!-- Center Pinion Housing -->
    <rect x="80" y="45" width="40" height="80" rx="6" fill="#1e40af" stroke="#172554" stroke-width="2"/>
    <!-- Bottom Drive Shaft/Flange -->
    <rect x="90" y="125" width="20" height="15" fill="url(#metalSilver)" stroke="#475569" stroke-width="1"/>
    <!-- Top Beacon / Position Indicator Switchbox -->
    <rect x="88" y="28" width="24" height="18" rx="3" fill="#0f172a"/>
    <ellipse cx="100" cy="28" rx="10" ry="7" fill="url(#indicatorYellow)"/>
    <path d="M94 28 L106 28" stroke="#000000" stroke-width="2"/>
    <!-- Air Ports -->
    <circle cx="65" cy="85" r="4" fill="url(#metalSilver)"/>
    <circle cx="135" cy="85" r="4" fill="url(#metalSilver)"/>
  </g>
</svg>
